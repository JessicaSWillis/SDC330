<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Student Information Form</h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/submitStudent}" th:object="${student}" method="post">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" th:field="*{studentName}">

        <label for="courseName">Course Name:</label>
        <input type="text" id="courseName" th:field="*{courseName}">

        <label for="favoriteTopic">Favorite Programming Topic:</label>
        <input type="text" id="favoriteTopic" th:field="*{favoriteTopic}">

        <label for="semester">Semester:</label>
        <input type="text" id="semester" th:field="*{semester}">

        <input type="submit" value="Submit">
    </form>

    <a th:href="@{/students}" class="button-link">View Students</a>
</div>
</body>
</html>
